<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chelate VNC</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #screen {
    position: absolute;
    inset: 0;
  }
  #keyboard-input {
    position: absolute;
    left: -1000px;
    top: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    font-size: 16px; /* prevents zoom on focus */
  }
</style>
</head>
<body>
<div id="screen"></div>
<textarea id="keyboard-input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" tabindex="-1"></textarea>
<script type="module" src="bridge.js"></script>
</body>
</html>
